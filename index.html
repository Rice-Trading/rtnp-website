<!doctype html>
<html lang="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTNP — Documentation</title>
<meta name="description" content="RTNP वेब पोर्टल की मार्गदर्शिका — अपनी भाषा चुनें। RTNP web portal documentation — choose your language.">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- DM Sans (Latin, brand font) + Noto Sans Devanagari (covers current Hindi, plus future Marathi/Nepali).
     When you add Bengali/Telugu/Tamil/Odia, append their Noto Sans <script> families here. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="docs/shell.css">
</head>
<body>

<div class="topbar">
  <button class="tb-btn" id="menuBtn" aria-label="menu">☰ <span class="lbl"></span></button>
  <span class="logo">🚛</span>
  <span class="brand"><span class="b1">RTNP</span><span class="b2">Documentation</span></span>
  <span class="sp"></span>
  <div class="pseg" id="productSwitch"><!-- product switcher (Web Portal | Mobile App) --></div>
  <button class="tb-btn" id="switchLang" title="Language">🌐 <span class="cur">Language</span></button>
</div>

<div class="shell">
  <aside class="side" id="side"><!-- built from the loaded language's sections --></aside>
  <main class="main" id="main"><!-- language content injected here --></main>
</div>

<div class="backdrop" id="backdrop"></div>
<button class="fab-top" id="toTop" aria-label="top">↑</button>

<!-- ============ Language picker (shown on first visit / via 🌐) ============ -->
<div class="lang-overlay" id="langOverlay" role="dialog" aria-modal="true" aria-label="Choose language">
  <div class="lang-box">
    <div class="brandrow"><span class="logo">🚛</span><div><div style="font-weight:700">RTNP</div><div style="font-size:.78rem;color:var(--txt-light)">Web Portal · Documentation</div></div></div>
    <h2>अपनी भाषा चुनें</h2>
    <p class="sub" lang="en" id="langOverlaySub">Choose your language for the documentation.</p>
    <div class="lang-grid" id="langGrid"></div>
    <div class="closerow"><button class="tb-btn" id="closeLang" style="background:var(--teal);border-color:var(--teal)">✕</button></div>
  </div>
</div>

<script src="docs/products.js"></script>
<script src="docs/languages.js"></script>
<script src="docs/app.js"></script>
<script>
  // allow closing the picker only after a language is active
  document.getElementById('closeLang').addEventListener('click', function(){
    if (document.documentElement.lang) document.getElementById('langOverlay').classList.remove('show');
  });
</script>
</body>
</html>
